name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 扫描器承诺纯标准库 + Python 3.9 兼容，两端都测
        python-version: [ "3.9", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test — scan bundled examples
        run: |
          python scripts/scan_boundary_risks.py scan examples --min-severity P1
          python scripts/scan_boundary_risks.py --list-rules

      - name: Smoke test — wraparound calculator (documented case)
        run: python scripts/scan_boundary_risks.py wrap --freq 4000000 --bits 32 --guard 900 --need 300

      - name: Verify examples report is up to date
        run: |
          python scripts/scan_boundary_risks.py scan examples --max-per-rule 6 --md /tmp/expected_scan.md > /dev/null
          # 只比较表格部分（首行摘要含路径差异）
          diff <(grep -E '^\| ' examples/expected_scan.md) <(grep -E '^\| ' /tmp/expected_scan.md) \
            || (echo "::warning::examples/expected_scan.md 与当前扫描结果不一致，请重新生成" && exit 1)
